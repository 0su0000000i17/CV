<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура CV Prophet</title>
  <desc id="desc">Поток от браузера через Next.js и Express API к self-hosted Supabase, фоновой очереди, Yandex AI и контуру документов.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d15"/><stop offset="1" stop-color="#0b1421"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101b2a"/><stop offset="1" stop-color="#0d1723"/></linearGradient>
    <linearGradient id="panelAccent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#132540"/><stop offset="1" stop-color="#102036"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000814" flood-opacity=".34"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#79aef5"/></marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#5e7799"/></marker>
    <style>
      .title { fill:#f5f8fd; font:700 31px Inter,Segoe UI,Arial,sans-serif }
      .subtitle { fill:#8392a8; font:400 15px Inter,Segoe UI,Arial,sans-serif }
      .eyebrow { fill:#75aaf0; font:700 12px Inter,Segoe UI,Arial,sans-serif; letter-spacing:1.5px }
      .cardTitle { fill:#f1f5fb; font:700 21px Inter,Segoe UI,Arial,sans-serif }
      .body { fill:#a3b0c2; font:400 14px Inter,Segoe UI,Arial,sans-serif }
      .small { fill:#8291a7; font:400 12px Inter,Segoe UI,Arial,sans-serif }
      .label { fill:#c9d8ec; font:600 12px Inter,Segoe UI,Arial,sans-serif }
      .number { fill:#91bfff; font:700 12px Inter,Segoe UI,Arial,sans-serif }
      .card { fill:url(#panel); stroke:#28425e; stroke-width:1 }
      .accentCard { fill:url(#panelAccent); stroke:#3c6594; stroke-width:1 }
      .line { fill:none; stroke:#79aef5; stroke-width:2; marker-end:url(#arrow) }
      .mutedLine { fill:none; stroke:#5e7799; stroke-width:2; marker-end:url(#arrowMuted) }
      .asyncLine { fill:none; stroke:#79aef5; stroke-width:2; stroke-dasharray:8 8; marker-end:url(#arrow) }
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#background)"/>
  <path d="M0 108H1600" stroke="#18283b"/>

  <g transform="translate(54 31)">
    <rect width="48" height="48" rx="13" fill="#5f94e6"/>
    <path d="M13 31l9-10 7 7 8-11" fill="none" stroke="#08111f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="37" cy="17" r="3" fill="#08111f"/>
    <text x="66" y="30" class="title">CV Prophet</text>
    <text x="66" y="53" class="subtitle">AI-сервис для российского рынка труда</text>
  </g>
  <g transform="translate(1287 32)">
    <rect width="260" height="44" rx="22" fill="#0f1c2b" stroke="#315479"/>
    <circle cx="22" cy="22" r="6" fill="#78adf4"/>
    <text x="40" y="27" class="label">SELF-HOSTED · РФ</text>
  </g>

  <path class="asyncLine" d="M460 210V142H1235V180"/>
  <g transform="translate(744 121)"><rect width="205" height="38" rx="19" fill="#0d1a2a" stroke="#315479"/><text x="102.5" y="24" text-anchor="middle" class="label">session · refresh · JWT</text></g>

