  <text x="160" y="433" text-anchor="middle" class="body">Публичные страницы</text>
  <text x="160" y="456" text-anchor="middle" class="body">Личный кабинет</text>

  <g filter="url(#shadow)"><rect x="310" y="210" width="300" height="300" rx="22" class="card"/></g>
  <rect x="334" y="234" width="38" height="28" rx="9" fill="#17365b"/><text x="353" y="253" text-anchor="middle" class="number">01</text>
  <text x="385" y="256" class="cardTitle">Frontend</text>
  <text x="334" y="286" class="body">Next.js 16 · React 19 · App Router</text>
  <rect x="334" y="315" width="252" height="72" rx="14" fill="#101c2b" stroke="#263f5b"/>
  <text x="354" y="344" class="label">Интерфейс продукта</text><text x="354" y="369" class="small">резюме · анализ · адаптация · отклики</text>
  <rect x="334" y="401" width="252" height="84" rx="14" fill="#111f31" stroke="#2d4a69"/>
  <text x="354" y="431" class="label">Сессия и состояние</text><text x="354" y="456" class="small">Supabase SSR · TanStack Query</text><text x="354" y="476" class="small">admin guards · API client</text>

  <g filter="url(#shadow)"><rect x="670" y="180" width="400" height="360" rx="22" class="card"/></g>
  <rect x="694" y="204" width="38" height="28" rx="9" fill="#17365b"/><text x="713" y="223" text-anchor="middle" class="number">02</text>
  <text x="745" y="226" class="cardTitle">Application backend</text><text x="694" y="256" class="body">Express 5 · TypeScript · REST API</text>
  <rect x="694" y="285" width="352" height="79" rx="14" class="accentCard"/>
  <text x="716" y="316" class="label">Защитный контур API</text><text x="716" y="341" class="small">JWT · CORS · rate limit · Zod · SSRF guard</text>
  <rect x="694" y="380" width="352" height="66" rx="14" fill="#101c2b" stroke="#263f5b"/>
  <text x="716" y="410" class="label">Маршруты и контроллеры</text><text x="716" y="432" class="small">resumes · vacancies · billing · profile · admin</text>
  <rect x="694" y="461" width="170" height="55" rx="13" fill="#101c2b" stroke="#263f5b"/><text x="714" y="489" class="label">AI-домены</text><text x="714" y="507" class="small">analyze · improve · adapt</text>
  <rect x="876" y="461" width="170" height="55" rx="13" fill="#101c2b" stroke="#263f5b"/><text x="896" y="489" class="label">Документы</text><text x="896" y="507" class="small">parse · version · export</text>

  <g filter="url(#shadow)"><rect x="1130" y="180" width="410" height="360" rx="22" class="card"/></g>
  <rect x="1154" y="204" width="38" height="28" rx="9" fill="#17365b"/><text x="1173" y="223" text-anchor="middle" class="number">03</text>
  <text x="1205" y="226" class="cardTitle">Self-hosted Supabase</text><text x="1154" y="256" class="body">Docker · PostgreSQL · собственная инфраструктура</text>
  <rect x="1154" y="285" width="362" height="65" rx="14" class="accentCard"/><text x="1175" y="315" class="label">Auth / GoTrue</text><text x="1175" y="338" class="small">email auth · JWT · сессии</text>
  <rect x="1154" y="364" width="174" height="120" rx="14" fill="#101c2b" stroke="#263f5b"/>
  <text x="1175" y="395" class="label">PostgreSQL</text><text x="1175" y="420" class="small">профили · резюме</text><text x="1175" y="442" class="small">версии · задачи</text><text x="1175" y="464" class="small">баланс · отклики</text>
  <rect x="1342" y="364" width="174" height="120" rx="14" fill="#101c2b" stroke="#263f5b"/>
  <text x="1363" y="395" class="label">Private Storage</text><text x="1363" y="420" class="small">PDF-резюме</text><text x="1363" y="442" class="small">signed URLs</text><text x="1363" y="464" class="small">private buckets</text>
  <text x="1154" y="515" class="small">RLS · backend-only privileges · migrations as source of truth</text>

