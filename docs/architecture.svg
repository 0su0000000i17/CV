  <circle cx="1385" cy="664" r="20" fill="#17365b"/><path d="M1378 652h11l6 6v17h-17zM1389 652v7h6" fill="none" stroke="#8bb9f7" stroke-width="2" stroke-linejoin="round"/>
  <text x="1416" y="668" class="cardTitle">Documents</text><text x="1369" y="709" class="body">Python · PDFKit</text><text x="1369" y="735" class="small">text · layout · photo</text><text x="1369" y="758" class="small">deterministic export</text>

  <path d="M54 835H1546" stroke="#18283b"/>
  <g transform="translate(60 858)"><path d="M0 0h35" class="line"/><text x="48" y="5" class="small">синхронный запрос</text><path d="M192 0h35" class="asyncLine"/><text x="240" y="5" class="small">фоновая задача / polling</text></g>
  <text x="1540" y="863" text-anchor="end" class="small">CV Prophet · application architecture · 2026</text>
</svg>
