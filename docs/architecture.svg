  <text x="747" y="671" class="cardTitle">Очередь и воркеры</text>
  <text x="694" y="708" class="body">PostgreSQL-backed задачи и статусы</text><text x="694" y="735" class="small">claim · retry · persist · polling</text><text x="694" y="760" class="small">analysis · improvement · adaptation · fit-check</text>

  <g filter="url(#shadow)"><rect x="1130" y="620" width="195" height="170" rx="22" class="card"/><rect x="1345" y="620" width="195" height="170" rx="22" class="card"/></g>
